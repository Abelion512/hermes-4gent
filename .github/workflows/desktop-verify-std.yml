name: Desktop verify (standard runners)

# Draft. No cache saves, no secrets; the only artifact is the Paper screenshot PNGs (synthetic mock UI). Visual snapshot diffs never fail the run (see e2e/visual-snapshot.ts). Standard GitHub-hosted runners only, no secrets, no publish, no deploy.
# Mirrors the repo's own desktop commands (apps/desktop package.json scripts, justfile).
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-verify-std.yml'

permissions:
  contents: read

concurrency:
  group: desktop-verify-std-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Record the checked SHA
        run: |
          echo "PR head: ${{ github.event.pull_request.head.sha }}"
          echo "Checked out: $(git rev-parse HEAD)"
          git log --oneline -3
          git diff --stat origin/${{ github.base_ref }}...HEAD || true
      - name: Install desktop workspace (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "./apps/desktop..." --filter "./apps/shared" --filter "./tests-js"
      - name: Runner hardware and toolchain actually in use
        run: |
          echo "cpus: $(nproc)"; free -m | head -2
          echo "node: $(node -v)"; echo "pnpm: $(pnpm -v)"; echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: ESLint
        working-directory: apps/desktop
        run: pnpm run lint
      - name: Typecheck
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run typecheck

  unit:
    name: Unit tests (ui project, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Install desktop workspace (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "./apps/desktop..." --filter "./apps/shared" --filter "./tests-js"
      - name: Runner hardware and toolchain actually in use
        run: |
          echo "cpus: $(nproc)"; free -m | head -2
          echo "node: $(node -v)"; echo "pnpm: $(pnpm -v)"; echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: Unit tests (shard ${{ matrix.shard }}/4 of the ui project)
        working-directory: apps/desktop
        run: pnpm exec vitest run --project ui --shard=${{ matrix.shard }}/4

  e2e:
    name: Build and Playwright E2E (Electron under xvfb)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Electron system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      # The E2E suite boots a real `hermes serve`, so it needs the locked Python test environment too
      # (same inputs as e2e-desktop.yml, with every cache save turned off).
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Install all workspaces (lifecycle scripts run, node-pty needs its native build)
        run: pnpm install --frozen-lockfile
      - name: Runner hardware and toolchain actually in use
        run: |
          echo "cpus: $(nproc)"; free -m | head -2
          echo "node: $(node -v)"; echo "pnpm: $(pnpm -v)"; echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: Prepare locked Electron runtime
        run: node scripts/build/electron-runtime.mjs --source .
      - name: Link the PM environment at the repo path the specs hardcode (CI checkout only)
        run: |
          if [ -e .venv ]; then echo ".venv already exists, leaving it"; else ln -s "$VIRTUAL_ENV" .venv; fi
          test -x .venv/bin/python
      - name: Record the exact source tested
        run: echo "PROBE-SRC HEAD=$(git rev-parse HEAD) pr-head=${{ github.event.pull_request.head.sha }}"
      - name: Build, then Playwright E2E
        working-directory: apps/desktop
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/pw-results.json
          # The PM test environment lives under RUNNER_TEMP, not in <repo>/.venv. The app resolves its Python from
          # HERMES_DESKTOP_PYTHON or <repo>/.venv, so without it the app never finds a runtime and sits on the setup overlay.
          # The step below exports it from the PM environment's HERMES_PYTHON and fails fast if that is missing.
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          if [ -z "${HERMES_PYTHON:-}" ] || [ ! -x "$HERMES_PYTHON" ]; then
            echo "HERMES_PYTHON is not set to an executable interpreter: ${HERMES_PYTHON:-unset}"; exit 1
          fi
          export HERMES_DESKTOP_PYTHON="$HERMES_PYTHON"
          echo "HERMES_DESKTOP_PYTHON=$HERMES_DESKTOP_PYTHON"
          pnpm run build
          xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm exec playwright test --reporter=list,json
      - name: Per-test result list (log and job summary only, no artifact)
        if: always()
        run: |
          cat > /tmp/summ.cjs <<'JS'
          const fs = require('fs')
          let r
          try { r = JSON.parse(fs.readFileSync('/tmp/pw-results.json', 'utf8')) } catch (e) { console.log('RESULT-LIST no json: ' + e.message); process.exit(0) }
          const rows = []
          const walk = (suite, file) => {
            for (const sp of suite.specs || []) for (const t of sp.tests || []) {
              const last = (t.results || []).slice(-1)[0] || {}
              rows.push((t.status || last.status || '?') + ' | ' + (sp.file || file) + ':' + sp.line + ' | ' + (sp.title || '').slice(0, 110))
            }
            for (const c of suite.suites || []) walk(c, suite.file || file)
          }
          for (const s of r.suites || []) walk(s, s.file)
          rows.sort()
          const out = rows.map((x) => 'RESULT-LIST ' + x).join('\n')
          console.log(out)
          console.log('RESULT-COUNTS ' + JSON.stringify(r.stats || {}))
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Per-test E2E results\n```\n' + rows.join('\n') + '\n```\n' + JSON.stringify(r.stats || {}) + '\n')
          JS
          node /tmp/summ.cjs

  paper-visual:
    name: Paper theme screenshots (synthetic fixture only, not a verdict input)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Electron system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      # The E2E suite boots a real `hermes serve`, so it needs the locked Python test environment too
      # (same inputs as e2e-desktop.yml, with every cache save turned off).
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Install all workspaces (lifecycle scripts run, node-pty needs its native build)
        run: pnpm install --frozen-lockfile
      - name: Runner hardware and toolchain actually in use
        run: |
          echo "cpus: $(nproc)"; free -m | head -2
          echo "node: $(node -v)"; echo "pnpm: $(pnpm -v)"; echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: Prepare locked Electron runtime
        run: node scripts/build/electron-runtime.mjs --source .
      - name: Link the PM environment at the repo path the specs hardcode (CI checkout only)
        run: |
          if [ -e .venv ]; then echo ".venv already exists, leaving it"; else ln -s "$VIRTUAL_ENV" .venv; fi
          test -x .venv/bin/python
      - name: Record the exact source tested
        run: echo "PROBE-SRC HEAD=$(git rev-parse HEAD) pr-head=${{ github.event.pull_request.head.sha }}"
      - name: Write the screenshot spec (generated at run time, not committed)
        working-directory: apps/desktop
        run: |
          cat > e2e/zz-paper-visual.spec.ts <<'TS'
          import fs from 'node:fs'

          import { runDesktopChatSmoke } from '../../../tests-js/scripts/desktop-chat-smoke'

          import { type MockBackendFixture, setupMockBackend, waitForAppReady } from './fixtures'
          import { expect, test } from './test'

          const OUT = process.env.PAPER_SHOTS_DIR || '/tmp/paper-shots'
          const SIZES = [
            { label: 'desktop-1220x800', width: 1220, height: 800 },
            { label: 'narrow-480x800', width: 480, height: 800 }
          ]

          for (const mode of ['light', 'dark'] as const) {
            test.describe(`Paper ${mode}`, () => {
              let fx: MockBackendFixture | null = null

              test.beforeAll(async () => {
                fs.mkdirSync(OUT, { recursive: true })
                fx = await setupMockBackend()
                await waitForAppReady(fx!, 120_000)
                // Seed Paper before the app code of the next load runs, then reload so boot reads it.
                await fx!.page.context().addInitScript(([m]) => {
                  localStorage.setItem('hermes-desktop-theme-v2', 'paper')
                  localStorage.setItem('hermes-desktop-mode-v1', m)
                }, [mode])
                await fx!.page.evaluate(([m]) => {
                  localStorage.setItem('hermes-desktop-theme-v2', 'paper')
                  localStorage.setItem('hermes-desktop-mode-v1', m)
                }, [mode])
                await fx!.page.reload()
                await waitForAppReady(fx!, 120_000)
              })

              test.afterAll(async () => {
                await fx?.cleanup()
                fx = null
              })

              test(`paper ${mode} is active and screenshots`, async () => {
                const page = fx!.page
                const state = await page.evaluate(() => ({
                  theme: document.documentElement.dataset.hermesTheme,
                  mode: document.documentElement.dataset.hermesMode,
                  bodyBg: getComputedStyle(document.body).backgroundColor
                }))
                console.log('PAPER-STATE ' + mode + ' ' + JSON.stringify(state))
                expect(state.theme).toBe('paper')
                expect(state.mode).toBe(mode)

                await runDesktopChatSmoke(page, {
                  mockUrl: fx!.mockUrl,
                  phase: 'installed',
                  outDir: test.info().outputPath('paper-chat')
                })

                for (const size of SIZES) {
                  await fx!.app.evaluate(({ BrowserWindow }, { width, height }) => {
                    const win = BrowserWindow.getAllWindows()[0]
                    win.unmaximize()
                    win.setMinimumSize(300, 300)
                    win.setBounds({ x: 0, y: 0, width, height })
                  }, size)
                  await page.waitForTimeout(800)
                  const actual = await page.evaluate(() => ({ w: window.innerWidth, h: window.innerHeight }))
                  console.log('PAPER-VIEWPORT ' + mode + ' ' + size.label + ' requested ' + size.width + 'x' + size.height + ' actual ' + JSON.stringify(actual))
                  await page.screenshot({ path: `${OUT}/paper-${mode}-${size.label}.png`, animations: 'disabled', caret: 'hide' })
                }
              })
            })
          }
          TS
      - name: Build, then Paper screenshots
        working-directory: apps/desktop
        env:
          CI: 'true'
          PAPER_SHOTS_DIR: /tmp/paper-shots
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          if [ -z "${HERMES_PYTHON:-}" ] || [ ! -x "$HERMES_PYTHON" ]; then
            echo "HERMES_PYTHON is not set to an executable interpreter: ${HERMES_PYTHON:-unset}"; exit 1
          fi
          export HERMES_DESKTOP_PYTHON="$HERMES_PYTHON"
          pnpm run build
          xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm exec playwright test e2e/zz-paper-visual.spec.ts --reporter=list --retries=0
      - name: List screenshots (PNG files only are uploaded)
        if: always()
        run: ls -la /tmp/paper-shots || true
      - name: Upload Paper screenshots (synthetic mock-backend UI only, no config, env or traces)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-visual-screenshots
          path: /tmp/paper-shots/*.png
          if-no-files-found: warn
          retention-days: 7

  verdict:
    name: Overall result (requires static, all unit shards and E2E)
    needs: [static, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "static=${{ needs.static.result }} unit=${{ needs.unit.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.static.result }}" = success && test "${{ needs.unit.result }}" = success && test "${{ needs.e2e.result }}" = success
