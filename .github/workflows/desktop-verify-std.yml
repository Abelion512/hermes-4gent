name: Desktop verify (standard runners)

# TEMPORARY LIMITED PROBE COMMIT: only the e2e-probe jobs (theme branch and true base) run here (no static, no unit shards, no verdict). It is a
# diagnostic of the failure classes from run 8, NOT a verdict and NOT a pass. The full validation file (v10) is restored
# in the next push once the causes are fixed.

# Draft. No cache saves, no artifacts, no secrets. Visual snapshot diffs never fail the run (see e2e/visual-snapshot.ts). Standard GitHub-hosted runners only, no secrets, no publish, no deploy.
# Mirrors the repo's own desktop commands (apps/desktop package.json scripts, justfile).
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-verify-std.yml'

permissions:
  contents: read

concurrency:
  group: desktop-verify-std-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-probe:
    name: LIMITED PROBE, selected E2E specs, not a verdict
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record the exact source tested
        run: |
          echo "PROBE-SRC HEAD=$(git rev-parse HEAD) pr-head=${{ github.event.pull_request.head.sha }}"
          git diff --stat 47778138a87770dfa336c9c83b77d40e1e3c6d03 HEAD -- . ':!.github' 2>&1 | tail -4 || true
      - name: Electron system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Install all workspaces (lifecycle scripts run, node-pty needs its native build)
        run: pnpm install --frozen-lockfile
      - name: Prepare locked Electron runtime
        run: node scripts/build/electron-runtime.mjs --source .
      - name: Inspect the PM Python environment against what the specs expect
        run: |
          set +e
          echo "PROBE-ENV HERMES_PYTHON=${HERMES_PYTHON:-unset} VIRTUAL_ENV=${VIRTUAL_ENV:-unset}"
          ls -d .venv venv 2>&1 | head -2
          (cd /tmp && "$HERMES_PYTHON" -c "import sys, hermes_cli; print('PROBE-ENV python', sys.version.split()[0], 'hermes_cli at', hermes_cli.__file__)") 2>&1 | head -3
          (cd "$GITHUB_WORKSPACE" && "$HERMES_PYTHON" -c "import hermes_cli; print('PROBE-ENV from repo cwd hermes_cli at', hermes_cli.__file__)") 2>&1 | head -3
          ls "$VIRTUAL_ENV/bin" | grep -i hermes | head -5 | sed 's/^/PROBE-ENV bin: /'
          "$VIRTUAL_ENV/bin/pip" list 2>/dev/null | grep -i hermes | sed 's/^/PROBE-ENV pip: /' || "$HERMES_PYTHON" -m pip list 2>/dev/null | grep -i hermes | sed 's/^/PROBE-ENV pip: /' || true
      - name: Link the PM environment at the repo path the specs hardcode (CI checkout only)
        run: |
          if [ -e .venv ]; then echo ".venv already exists, leaving it"; else ln -s "$VIRTUAL_ENV" .venv; fi
          test -x .venv/bin/python
          ls -l .venv | head -1
      - name: Build, then run the selected specs (no retries, probe only)
        working-directory: apps/desktop
        env:
          CI: 'true'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          set +e
          if [ -z "${HERMES_PYTHON:-}" ] || [ ! -x "$HERMES_PYTHON" ]; then
            echo "HERMES_PYTHON is not set to an executable interpreter: ${HERMES_PYTHON:-unset}"; exit 1
          fi
          export HERMES_DESKTOP_PYTHON="$HERMES_PYTHON"
          pnpm run build
          echo "PROBE-DIST dist entries:"; ls dist | head -20
          echo "PROBE-DIST dist/assets css:"; find dist -name '*.css' | head -10
          xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm exec playwright test \
            e2e/chat.spec.ts e2e/onboarding.spec.ts e2e/markdown-overflow.spec.ts e2e/sticky-prompt-clip.spec.ts \
            e2e/new-bot-config-on-disk.spec.ts e2e/fleet-profile-rail.spec.ts e2e/completed-reply-refresh.spec.ts \
            e2e/group-turn-integrity.spec.ts:118 e2e/cross-gateway-group.spec.ts:289 e2e/image-attachment-resume.spec.ts \
            --reporter=list --retries=0
          code=$?
          echo "PROBE-RESULT playwright exit code $code, this probe is not a verdict"
          exit 0

  e2e-probe-base:
    name: LIMITED PROBE on the true base 47778138, same specs, not a verdict
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 47778138a87770dfa336c9c83b77d40e1e3c6d03
          persist-credentials: false
      - name: Record the base commit and its diff to the PR code
        run: |
          echo "PROBE-SRC HEAD=$(git rev-parse HEAD) (true base)"
      - name: Electron system libraries
