name: Desktop verify (standard runners)

# Draft. No cache saves, no artifacts, no secrets. Visual snapshot diffs never fail the run (see e2e/visual-snapshot.ts). Standard GitHub-hosted runners only, no secrets, no publish, no deploy.
# Mirrors the repo's own desktop commands (apps/desktop package.json scripts, justfile).
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-verify-std.yml'

permissions:
  contents: read

concurrency:
  group: desktop-verify-std-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Record the checked SHA
        run: |
          echo "PR head: ${{ github.event.pull_request.head.sha }}"
          echo "Checked out: $(git rev-parse HEAD)"
          git log --oneline -3
          git diff --stat origin/${{ github.base_ref }}...HEAD || true
      - name: Install desktop workspace (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "./apps/desktop..." --filter "./apps/shared" --filter "./tests-js"
      - name: Runner hardware and toolchain actually in use
        run: |
          echo "cpus: $(nproc)"; free -m | head -2
          echo "node: $(node -v)"; echo "pnpm: $(pnpm -v)"; echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: ESLint
        working-directory: apps/desktop
        run: pnpm run lint
      - name: Typecheck
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run typecheck

  unit:
    name: Unit tests (ui project, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Install desktop workspace (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "./apps/desktop..." --filter "./apps/shared" --filter "./tests-js"
      - name: Runner hardware and toolchain actually in use
        run: |
          echo "cpus: $(nproc)"; free -m | head -2
          echo "node: $(node -v)"; echo "pnpm: $(pnpm -v)"; echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: Unit tests (shard ${{ matrix.shard }}/4 of the ui project)
        working-directory: apps/desktop
        run: pnpm exec vitest run --project ui --shard=${{ matrix.shard }}/4

  e2e:
    name: Build and Playwright E2E (Electron under xvfb)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Electron system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      # The E2E suite boots a real `hermes serve`, so it needs the locked Python test environment too
      # (same inputs as e2e-desktop.yml, with every cache save turned off).
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all"]'
          test-environment: 'true'
          save-tools-cache: 'false'
          save-node-cache: 'false'
          save-python-cache: 'false'
      - name: Install all workspaces (lifecycle scripts run, node-pty needs its native build)
        run: pnpm install --frozen-lockfile
      - name: Runner hardware and toolchain actually in use
        run: |
          echo "cpus: $(nproc)"; free -m | head -2
          echo "node: $(node -v)"; echo "pnpm: $(pnpm -v)"; echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
      - name: Prepare locked Electron runtime
        run: node scripts/build/electron-runtime.mjs --source .
      - name: Build, then Playwright E2E
        working-directory: apps/desktop
        env:
          CI: 'true'
          # The PM test environment lives under RUNNER_TEMP, not in <repo>/.venv. The app resolves its Python from
          # HERMES_DESKTOP_PYTHON or <repo>/.venv, so without it the app never finds a runtime and sits on the setup overlay.
          # The step below exports it from the PM environment's HERMES_PYTHON and fails fast if that is missing.
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          if [ -z "${HERMES_PYTHON:-}" ] || [ ! -x "$HERMES_PYTHON" ]; then
            echo "HERMES_PYTHON is not set to an executable interpreter: ${HERMES_PYTHON:-unset}"; exit 1
          fi
          export HERMES_DESKTOP_PYTHON="$HERMES_PYTHON"
          echo "HERMES_DESKTOP_PYTHON=$HERMES_DESKTOP_PYTHON"
          pnpm run build
          xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm exec playwright test --reporter=list

  verdict:
    name: Overall result (requires static, all unit shards and E2E)
    needs: [static, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "static=${{ needs.static.result }} unit=${{ needs.unit.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.static.result }}" = success && test "${{ needs.unit.result }}" = success && test "${{ needs.e2e.result }}" = success
